baseurl: ""

collections:
  workspaces:
    output: true
    permalink: /:collection/:name/
    defaults:
      -
        scope:
          path: ""
        values:
          layout: "default"

  docs:
    output: true
    permalink: /:collection/:name/
    defaults:
      -
        scope:
          path: ""
        values:
          layout: "docs"

include:
  - "script.js"
  - "favicon.ico"
  - "manifest.json"
  - "sw.js"

exclude:
  - tests
  - vendor/
  - node_modules/
  - verify_loading_screen.py
  - verify_background.py
